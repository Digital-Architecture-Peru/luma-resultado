spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USER:banking}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

transfers:
  # Límite ficticio por operación (configurable)
  max-amount: ${TRANSFER_MAX_AMOUNT:10000.00}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
