spring:
  application:
    name: cuentas-consulta
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banca}
    username: ${DB_USER:banca}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: ${LOG_LEVEL:INFO}
