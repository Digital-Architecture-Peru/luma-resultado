server:
  port: ${PORT:8080}

spring:
  application:
    name: payments-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: ${LOG_LEVEL:INFO}
