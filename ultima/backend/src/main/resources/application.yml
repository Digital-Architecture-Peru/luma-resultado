spring:
  application:
    name: consulta-pagos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banca}
    username: ${DB_USER:banca_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: ${LOG_LEVEL:INFO}
