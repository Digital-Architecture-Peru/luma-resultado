# Configuración por variables de entorno (ver backend/.env.example). Sin secretos en el repositorio.
quarkus.http.port=${PORT:8080}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/banca}
quarkus.datasource.username=${DB_USER:banca_app}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.log.level=${LOG_LEVEL:INFO}

%test.quarkus.flyway.migrate-at-start=false
