# Configuracion por variables de entorno (ver .env.example). Sin secretos en el repositorio.
quarkus.http.port=${PORT:8080}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/pagos}
quarkus.datasource.username=${DB_USER:pagos_app}
quarkus.datasource.password=${DB_PASSWORD:}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.log.level=${LOG_LEVEL:INFO}
