# Configuración por variables de entorno; no se guardan secretos en el repositorio.
quarkus.http.port=${PORT:8080}
quarkus.log.level=${LOG_LEVEL:INFO}

# PostgreSQL (QUARKUS_DATASOURCE_USERNAME / QUARKUS_DATASOURCE_PASSWORD vienen del entorno)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/cards_notifications}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:10}

# Flyway: db/migration = esquema; db/seed = datos ficticios (quitar db/seed fuera de demo)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=${FLYWAY_LOCATIONS:db/migration,db/seed}

# CORS para el front (Vite en desarrollo)
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,PUT,PATCH,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,X-Customer-Id

# Sin PostgreSQL en pruebas unitarias: no se levantan servicios de desarrollo
quarkus.devservices.enabled=false
