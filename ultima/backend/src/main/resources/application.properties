# Toda la configuracion sensible llega por variables de entorno (ver README / .env.example).
quarkus.http.port=${PORT:8080}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/tarjetas}
quarkus.datasource.username=${DB_USER:tarjetas}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Limite ficticio del stub de procesador de tarjetas (integracion sin definir)
tarjetas.stub.limite=${TARJETAS_STUB_LIMITE:5000.00}

quarkus.log.level=${LOG_LEVEL:INFO}
%test.quarkus.devservices.enabled=false

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.headers=Content-Type,Idempotency-Key,X-Cliente-Id
quarkus.http.cors.methods=GET,POST
