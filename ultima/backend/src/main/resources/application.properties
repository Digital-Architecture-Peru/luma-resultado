# Configuración por variables de entorno (ver README). Sin secretos en el repositorio.
quarkus.http.port=${PORT:8080}
quarkus.devservices.enabled=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/pagos}
quarkus.datasource.username=${DB_USER:pagos}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.json=${LOG_JSON:false}
