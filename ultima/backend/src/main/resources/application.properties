# Configuración por entorno. Sin secretos: la contraseña llega por variable de entorno.
quarkus.http.port=${PORT:8080}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/notificaciones}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:notificaciones}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:}
quarkus.datasource.devservices.enabled=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PATCH,OPTIONS
quarkus.http.cors.headers=accept,content-type,x-customer-id

quarkus.log.level=${LOG_LEVEL:INFO}
