quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:notifications}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/notifications}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.json=false
