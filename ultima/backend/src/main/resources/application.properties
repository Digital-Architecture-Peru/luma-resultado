quarkus.http.port=${PORT:8080}

# PostgreSQL: valores por variable de entorno (sin secretos en el repositorio)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/cards}
quarkus.datasource.username=${DB_USER:cards_app}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.database.generation=none

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# CORS solo para el origen local en dev
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:4200
%dev.quarkus.http.cors.headers=accept,content-type,x-customer-id
%dev.quarkus.http.cors.methods=GET,OPTIONS

quarkus.log.level=${LOG_LEVEL:INFO}
