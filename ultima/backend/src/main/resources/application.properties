quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.headers=Content-Type,Idempotency-Key
quarkus.http.cors.methods=GET,POST,OPTIONS

# PostgreSQL: credenciales solo por variables de entorno (ver .env.example)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.datasource.username=${DB_USER:payments_app}
quarkus.datasource.password=${DB_PASSWORD:change-me-local-only}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.log.level=${LOG_LEVEL:INFO}

# Limite maximo de pago (regla de dominio supuesta H6)
payments.max-amount=${PAYMENTS_MAX_AMOUNT:50000}
payments.gateway.decline-above=${PAYMENTS_STUB_DECLINE_ABOVE:20000}
