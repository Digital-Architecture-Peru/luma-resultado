# Configuración por entorno. Sin secretos: definir QUARKUS_DATASOURCE_* al ejecutar.
quarkus.application.name=payments-query
quarkus.http.port=${PORT:8080}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:payments}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.datasource.jdbc.max-size=10

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Los tests son unitarios: no se arranca base de datos.
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.datasource.devservices.enabled=false

# CORS solo en desarrollo (Vite en 5173)
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173
%dev.quarkus.http.cors.headers=X-Customer-Id,Content-Type
%dev.quarkus.http.cors.methods=GET,OPTIONS
