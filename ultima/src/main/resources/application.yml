spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tarjetas}
    username: ${DATABASE_USER:tarjetas_app}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Seed ficticio solo con el perfil "dev" (ver README)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: ${LOG_LEVEL:INFO}
server:
  port: ${PORT:8080}
---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
