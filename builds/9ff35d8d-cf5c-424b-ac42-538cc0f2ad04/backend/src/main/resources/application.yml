spring:
  application:
    name: cards-query
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cards}
    username: ${DB_USER:cards}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: ${LOG_LEVEL:INFO}
