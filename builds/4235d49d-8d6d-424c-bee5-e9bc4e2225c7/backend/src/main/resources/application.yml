spring:
  application:
    name: cuentas-notificaciones
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notificaciones}
    username: ${DB_USER:notif_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:4200}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
