# Configuración por variables de entorno (ver .env.example). Sin secretos en el repositorio.
quarkus.http.port=${PORT:8080}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/tarjetas}
quarkus.datasource.username=${DB_USER:tarjetas}
quarkus.datasource.password=${DB_PASSWORD}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,OPTIONS
quarkus.http.cors.headers=accept,content-type,x-cliente-id

quarkus.log.level=${LOG_LEVEL:INFO}
