# Configuración por variables de entorno; sin secretos en el repositorio.
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,PUT,PATCH,OPTIONS

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/notificaciones}
quarkus.datasource.username=${DB_USER:notificaciones}
quarkus.datasource.password=${DB_PASSWORD:}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.log.level=${LOG_LEVEL:INFO}
