spring:
  application:
    name: notificaciones-cuentas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notificaciones}
    username: ${DB_USER:notificaciones}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: ${LOG_LEVEL:INFO}
