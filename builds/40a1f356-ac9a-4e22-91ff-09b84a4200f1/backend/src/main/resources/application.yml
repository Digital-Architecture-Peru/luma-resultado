server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: consulta-cuentas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banca}
    username: ${DB_USER:banca_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: ${LOG_LEVEL:INFO}
