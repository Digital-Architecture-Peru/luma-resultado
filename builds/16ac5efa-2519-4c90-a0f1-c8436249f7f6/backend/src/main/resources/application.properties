# Configuracion por variables de entorno (ver ../.env.example). Sin secretos en el repositorio.
# La contrasena se toma de QUARKUS_DATASOURCE_PASSWORD (mapeo automatico de Quarkus).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/cuentas}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:cuentas}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.http.port=${PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Idempotency-Key

quarkus.log.level=${LOG_LEVEL:INFO}

# H3: autenticacion fuera de alcance; titular ficticio fijo.
app.owner-id=${APP_OWNER_ID:demo-owner}
