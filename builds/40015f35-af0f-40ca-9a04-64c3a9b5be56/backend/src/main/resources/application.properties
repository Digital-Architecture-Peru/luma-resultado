# Credenciales solo por entorno: QUARKUS_DATASOURCE_USERNAME / QUARKUS_DATASOURCE_PASSWORD
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/banca}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,OPTIONS
quarkus.http.cors.headers=X-Customer-Id,Content-Type

quarkus.log.level=${LOG_LEVEL:INFO}
