spring:
  application:
    name: cards-query
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cards}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
