services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: card_notifications
      POSTGRES_USER: cardnotif
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en el entorno}
    ports:
      - "5432:5432"
    volumes:
      # Los .sql se ejecutan en orden alfabético solo en la primera inicialización.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
