# Configuración por variables de entorno (sin secretos en el repositorio):
#   QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
#   CORS_ORIGINS (orígenes permitidos para el front, separados por coma)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,PATCH,OPTIONS

quarkus.log.level=${LOG_LEVEL:INFO}
%dev.quarkus.log.level=DEBUG
