quarkus.http.port=${PORT:8080}

# PostgreSQL: usuario, clave y URL se inyectan por entorno (ver README). Sin secretos en el repositorio.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/notifications}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:notifications}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# CORS entre Angular (4200) y el backend
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PATCH,OPTIONS
quarkus.http.cors.headers=Content-Type,X-Customer-Id

quarkus.log.level=${LOG_LEVEL:INFO}
