quarkus.http.port=${PORT:8080}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/cards}
quarkus.datasource.username=${DB_USER:cards_app}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
%test.quarkus.flyway.migrate-at-start=false
