quarkus.http.port=${PORT:8080}
quarkus.http.cors.~~=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/cards}
quarkus.datasource.username=${DB_USER:cards_app}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Stub de autenticacion (H1): cliente fijo por entorno. Sustituir por OIDC/JWT.
cards.demo-customer-id=${DEMO_CUSTOMER_ID:11111111-1111-1111-1111-111111111111}

quarkus.log.level=${LOG_LEVEL:INFO}

# Pruebas unitarias: sin base de datos ni Dev Services
%test.quarkus.devservices.enabled=false
%test.quarkus.flyway.migrate-at-start=false
