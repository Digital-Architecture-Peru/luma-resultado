spring:
  application:
    name: cuentas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cuentas}
    username: ${DB_USER:cuentas}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: ${LOG_LEVEL:INFO}
