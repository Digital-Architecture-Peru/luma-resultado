# Solo para desarrollo local. La contraseña se toma del entorno (ver .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cards
      POSTGRES_USER: cards_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
