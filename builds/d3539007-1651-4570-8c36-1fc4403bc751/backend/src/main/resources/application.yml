spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cards}
    username: ${DB_USER:cards_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  # Autenticacion simulada (H2): la Banca por Internet real aportaria el cliente.
  demo-customer-id: ${DEMO_CUSTOMER_ID:cust-demo-001}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
