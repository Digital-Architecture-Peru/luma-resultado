spring:
  application:
    name: cards-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cards}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
